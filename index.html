<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Dónde viene mi combi? Tula - San Pedro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#f2f2f2}
  header{background:#0E7A3E;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:1000}
  header h1{margin:0;font-size:19px}
  header p{margin:5px 0 0;font-size:13px}
  .live-dot{display:inline-block;width:10px;height:10px;background:#FF3B30;border-radius:50%;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  #map{height:400px;width:100%;background:#ddd;z-index:1}
  .card{margin:10px;background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .card.uno{border-left:7px solid #1976D2}
  .card.dos{border-left:7px solid #FF6F00}
  .top{display:flex;justify-content:space-between;align-items:center}
  .eta{font-weight:bold;font-size:18px}
  .uno .eta{color:#1976D2} .dos .eta{color:#E65100}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;color:white}
  .en-vivo{background:#0E7A3E} .sin-senal{background:#999}
  .btn-ubicacion{width:calc(100% - 20px);margin:10px;background:#111;color:white;border:0;padding:16px;border-radius:12px;font-weight:bold;font-size:16px}
  .btn-mapa{width:calc(100% - 20px);margin:0 10px 10px;background:#111;color:white;border:0;padding:12px;border-radius:10px;font-size:13px}
  .pin{width:56px;height:32px;border-radius:16px;border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px}
  .pin-azul{background:#1976D2} .pin-naranja{background:#FF6F00}
  .pin-pulso{animation:pulso 1.5s infinite}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(25,118,210,.5)}100%{box-shadow:0 0 0 18px rgba(25,118,210,0)}}
  .alerta{background:#FFF3CD;border:2px solid #FFC107;padding:12px;border-radius:12px;margin:10px;text-align:center;display:none}
  .alerta.activa{display:block;animation:blink 1s infinite}
  .yo{text-align:center;font-size:13px;color:#333;margin:8px}
  .aviso{background:#FFE0E0;border:2px solid #D32F2F;padding:10px;border-radius:10px;margin:10px;text-align:center;display:none;font-size:13px}
  select{width:calc(100% - 20px);margin:0 10px 10px;padding:14px;border-radius:10px;font-size:15px;background:white;border:1px solid #ccc;font-weight:bold}
  .paradas-titulo{text-align:center;font-size:13px;margin:10px 10px 5px;font-weight:bold}
  .chip-parada{display:inline-block;background:white;border:2px solid #0E7A3E;color:#0E7A3E;padding:8px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin:3px;cursor:pointer}
  .chip-parada.activa{background:#0E7A3E;color:white}
</style>
</head>
<body>
<header>
  <h1>🚌 ¿DÓNDE VIENE MI COMBI?</h1>
  <p><span class="live-dot"></span> RUTA TULA - SAN PED
